<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다시, 그 마음가짐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --sky:#EAF6FF; --card:#FFFFFF; --border:#E3F1FB; --ink:#243B4A; --ink-soft:#7C93A3;
    --coral:#FF7A6E; --lemon:#FFC93C; --mint:#1FC8A9; --ocean:#3AA6D6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#FCFEFF;
    color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:20px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  .stickers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .stickers span{position:absolute;font-size:52px;opacity:.16;filter:saturate(1.1);}
  .wrap{position:relative;z-index:1;}
  .wrap{max-width:560px;margin:0 auto;}

  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;letter-spacing:.06em;font-weight:800;color:#fff;
    background:linear-gradient(90deg, var(--ocean), var(--mint));
    box-shadow:0 6px 16px rgba(58,166,214,.30);
    padding:7px 15px;border-radius:100px;margin-bottom:14px;
  }
  h1{
    font-family:'Jua', sans-serif;font-weight:400;font-size:30px;
    margin:0 0 10px;line-height:1.3;color:var(--ink);
  }
  h1 .hl{color:var(--coral);}
  .lead{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:20px;}
  .lead b{color:var(--ocean);}

  .filters{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-chip{
    font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;
    border:1.5px solid var(--border);background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .filter-chip.active{background:linear-gradient(90deg,var(--coral),#FF9A70);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,122,110,.35);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:0 4px 16px rgba(58,166,214,.07);
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  }
  .card:nth-child(4n+1)::before{background:var(--coral);}
  .card:nth-child(4n+2)::before{background:var(--lemon);}
  .card:nth-child(4n+3)::before{background:var(--mint);}
  .card:nth-child(4n+4)::before{background:var(--ocean);}

  .card-name{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Jua', sans-serif;font-size:15px;color:var(--ink);
    margin-bottom:10px;
  }
  .card-name .grade-tag{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    font-size:10.5px;font-weight:700;color:var(--ocean);
    background:#EAF6FF;border:1px solid var(--border);border-radius:100px;
    padding:3px 10px;
  }
  .card-text{font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}

  .empty-state{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 0;}
</style>
</head>
<body>
<div class="stickers">
  <span style="top:4%; left:-3%; transform:rotate(-18deg);">🍉</span>

</div>
<div class="wrap">

  </div>

  <div class="filters" id="filters">
    <button class="filter-chip active" data-grade="">전체</button>
    <button class="filter-chip" data-grade="1학년">1학년</button>
    <button class="filter-chip" data-grade="2학년">2학년</button>
    <button class="filter-chip" data-grade="3학년">3학년</button>
  </div>

  <div id="list"></div>
</div>

<script>

const listEl = document.getElementById('list');

function render(gradeFilter){
  const rows = gradeFilter ? DATA.filter(d => d.grade === gradeFilter) : DATA;

  if(rows.length === 0){
    listEl.innerHTML = '<div class="empty-state">해당하는 다짐이 없어요.</div>';
    return;
  }

  listEl.innerHTML = rows.map(d => `
    <div class="card">
      <div class="card-name"><span class="grade-tag">${d.grade}</span> ${d.masked}</div>
      <div class="card-text">${d.text.replace(/</g,'&lt;')}</div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.grade);
  });
});
